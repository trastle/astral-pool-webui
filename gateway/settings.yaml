# Non-secret defaults. Override per-deployment with environment variables
# (CHLORINATOR_<NAME>, e.g. CHLORINATOR_DEVICE_NAME - see README) rather
# than editing this file, so it stays generic across installs. The access
# code goes in .secrets.yaml instead (see .secrets.yaml.example) - never
# here.
device_name: POOL01
poll_interval_seconds: 60
http_port: 8080

# MQTT is optional - leave mqtt.host unset to run without it (dashboard and
# /metrics keep working either way). Set these once an MQTT broker (e.g.
# the Mosquitto add-on, if you run Home Assistant OS/Supervised) is
# reachable. Override with CHLORINATOR_MQTT__HOST, CHLORINATOR_MQTT__PORT,
# etc. (double underscore for nesting).
mqtt:
  host:
  port: 1883
  username:
  password:
  # base_topic left unset on purpose - defaults to chlorinator/<device
  # name, lowercased> (matching hwmaier/chlorinator-gateway's topic
  # scheme). Only set this to override that.
  base_topic:
